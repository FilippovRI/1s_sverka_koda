<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Разбор модулей</title>
<style>
body{margin:0;font:13px Segoe UI,Arial,sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:6px 10px;background:#24364b;color:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header button{padding:3px 8px;cursor:pointer}
#main{flex:1;display:flex;min-height:0}
#tree{width:360px;overflow:auto;border-right:1px solid #ccc;padding:6px}
#view{flex:1;overflow:auto;padding:8px}
details{margin-left:6px}summary{cursor:pointer;font-weight:600}
.mod{cursor:pointer;padding:1px 4px;margin-left:14px;white-space:nowrap}
.mod.sel,.proc.sel{background:#cfe3ff}
.proc{cursor:pointer;margin-left:30px;font-size:12px;white-space:nowrap}
.st-changed{color:#b35c00}.st-added{color:#1a7f37}.st-removed{color:#c62828}.st-same{color:#888}
.hint{background:#fff8e1;border:1px solid #f0d27a;padding:6px 10px;margin:6px 0;border-radius:4px}
.hook{display:inline-block;background:#e3f2fd;border:1px solid #90caf9;color:#0d47a1;padding:1px 6px;border-radius:3px;font:12px Consolas,monospace;margin-right:4px}
.badge-export{display:inline-block;background:#e8f5e9;border:1px solid #81c784;color:#1b5e20;padding:1px 6px;border-radius:3px;font:11px Segoe UI,sans-serif;margin-right:4px}
.badge-hookfail{display:inline-block;background:#ffebee;border:1px solid #e57373;color:#b71c1c;padding:1px 6px;border-radius:3px;font:11px Segoe UI,sans-serif;margin-right:4px}
.badge-sig{display:inline-block;background:#fff8e1;border:1px solid #ffcc80;color:#e65100;padding:1px 6px;border-radius:3px;font:11px Segoe UI,sans-serif;margin-right:4px}
.hookbody{background:#f7f9fc;border:1px solid #cfd8dc;padding:8px;margin:6px 0;border-radius:4px}
.cols{display:flex;gap:6px}.cols>div{flex:1;min-width:0}
pre{margin:0;font:12px Consolas,monospace;white-space:pre-wrap;word-break:break-all}
table.d{border-collapse:collapse;width:100%;font:12px Consolas,monospace;table-layout:fixed}
table.d td{vertical-align:top;padding:0 4px;white-space:pre-wrap;word-break:break-all}
td.del{background:#ffe6e6}td.ins{background:#e6ffec}td.n{color:#999;width:40px;text-align:right}
h3{margin:6px 0}
#bsparser{flex:none;margin:0;padding:4px 10px;max-height:35vh;overflow:auto;border-bottom:1px solid #ccc;background:#f7f9fc}
#reverseBuild{flex:none;margin:0;padding:4px 10px;max-height:40vh;overflow:auto;border-bottom:1px solid #ccc;background:#f7f9fc}
</style></head><body>
<header>
<b>Разбор модулей</b><span id="meta"></span>
<button onclick="goMod(-1)">◀ Предыдущий раздел</button><button onclick="goMod(1)">Следующий раздел ▶</button>
<button onclick="goProc(-1)">▲ Предыдущая процедура</button><button onclick="goProc(1)">Следующая процедура ▼</button>
<label><input type="checkbox" id="showSame" onchange="onFilter()"> показывать совпадающие процедуры</label>
<label><input type="checkbox" id="onlyChanged" checked onchange="onFilter()"> показывать только изменённые</label>
<label><input type="checkbox" id="onlyWrapper" onchange="onFilter()"> только с обёрткой &amp;Вместо</label>
<label><input type="checkbox" id="onlyHookFail" onchange="onFilter()"> только «контроль не пройдёт»</label>
<label><input type="checkbox" id="onlySigMoved" onchange="onFilter()"> только с вынесенной сигнатурой УП</label>
</header>
<div id="main"><div id="tree"></div><div id="view"></div></div>
<script type="application/json" id="report-data">/*__DATA__*/null</script>
<script>
const DATA=JSON.parse(document.getElementById("report-data").textContent);
const BN={manual:"Ручной разбор",auto:"Автоунос (хуки / новые методы)",cosmetic:"Отличие без доработки",only_source:"Только в исходной",only_vendor:"Только у поставщика",wrappersAdded:"Обёртка &Вместо в расширении"};
const ORDER=["manual","auto","cosmetic","only_source","only_vendor","wrappersAdded"];
const HK={before:"&Перед",after:"&После",changeAndControl:"&ИзменениеИКонтроль",instead:"&Вместо",newMethod:"новый метод",none:""};
const mods=[];ORDER.forEach(b=>DATA.modules.filter(m=>m.bucket==b).forEach(m=>mods.push(m)));
let cur=0,curP=-1,treeBuilt=false;
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const hkLabel=h=>HK[h]||"";
document.getElementById("meta").textContent=" исходная: "+DATA.meta.sourceName+" · поставщик: "+DATA.meta.vendorName+" · "+DATA.meta.generated+" · одинаковых модулей скрыто: "+DATA.counts.identical+(DATA.returnedToVendor!=null?" · методов «нет в УП» возвращено в типовой (есть в restored): "+DATA.returnedToVendor:"")+(DATA.wrappersAdded!=null?" · обёртки &Вместо: "+DATA.wrappersAdded:"")+(DATA.hookCheck&&DATA.hookCheck.mismatch!=null?" · контроль не пройдёт: "+DATA.hookCheck.mismatch+" из "+(DATA.hookCheck.checked||0):"")+(DATA.signaturesMoved!=null?" · вынесена сигнатура УП: "+DATA.signaturesMoved:"");
function onlyChanged(){return document.getElementById("onlyChanged").checked}
function onlyWrapper(){return document.getElementById("onlyWrapper").checked}
function onlyHookFail(){return document.getElementById("onlyHookFail").checked}
function onlySigMoved(){return document.getElementById("onlySigMoved").checked}
function badges(p){let s="";if(p.wrapperAdded)s+='<span class="badge-export">обёртка &Вместо</span>';if(p.hookCheckFail)s+='<span class="badge-hookfail">контроль не пройдёт</span>';if(p.upSignatureMoved)s+='<span class="badge-sig">вынесена сигнатура УП</span>';return s}
function procs(m){const oe=onlyWrapper(),of=onlyHookFail(),os=onlySigMoved();return (m.methods||[]).filter(p=>{
 if(oe&&!p.wrapperAdded)return false;
 if(of&&!p.hookCheckFail)return false;
 if(os&&!p.upSignatureMoved)return false;
 if(oe||of||os)return true;
 if(p.status=="same"&&!document.getElementById("showSame").checked)return false;
 if(onlyChanged()&&p.status=="removed")return false;
 return true})}
function moduleVisible(m){
 if(m.bucket=="wrappersAdded"&&!onlyWrapper())return false;
 if(!onlyChanged()&&!onlyWrapper()&&!onlyHookFail()&&!onlySigMoved())return true;
 const ms=m.methods||[];
 if(!ms.length&&!onlyWrapper()&&!onlyHookFail()&&!onlySigMoved())return true;
 return procs(m).length>0}
function vis(){return mods.filter(moduleVisible)}
function buildTree(){
 if(treeBuilt)return;
 const v=vis();
 let h="";ORDER.forEach(b=>{const ms=v.filter(m=>m.bucket==b);if(!ms.length)return;
 h+=`<details open><summary>${BN[b]} (${ms.length})</summary>`;const types={};ms.forEach(m=>(types[m.type]=types[m.type]||[]).push(m));
 Object.keys(types).sort().forEach(t=>{h+=`<details${b=="manual"?" open":""}><summary>${esc(t)} (${types[t].length})</summary>`;
  types[t].forEach(m=>{const i=mods.indexOf(m);h+=`<div class="mod" id="m${i}" onclick="sel(${i},-1)">${esc(m.path.split("\\").slice(1).join("\\")||m.path)}</div><div id="pl${i}"></div>`});h+="</details>"});h+="</details>"});
 document.getElementById("tree").innerHTML=h||(onlyChanged()?"Нет модулей с изменёнными методами.":"Отличий нет.");
 treeBuilt=true;
}
function onFilter(){treeBuilt=false;const v=vis();if(v.length&&v.indexOf(mods[cur])<0){cur=mods.indexOf(v[0]);curP=-1}else{const ps=mods[cur]?procs(mods[cur]):[];if(curP>=ps.length)curP=-1}render(true)}
function sel(i,p){cur=i;curP=p;render(true)}
function goMod(d){const v=vis();if(!v.length)return;let k=v.indexOf(mods[cur]);if(k<0)k=d>0?-1:0;cur=mods.indexOf(v[(k+d+v.length)%v.length]);curP=-1;render(true)}
function goProc(d){const ps=procs(mods[cur]||{});if(!ps.length)return;curP=curP<0?(d>0?0:ps.length-1):(curP+d+ps.length)%ps.length;render(true)}
function renderHunks(hunks){
 if(!hunks||!hunks.length)return "<div>Нет изменённых фрагментов.</div>";
 let r="";
 const row=(x,cx,y,cy,ni,nj)=>`<tr><td class="n">${ni||""}</td><td class="${cx}">${esc(x)}</td><td class="n">${nj||""}</td><td class="${cy}">${esc(y)}</td></tr>`;
 hunks.forEach((h,idx)=>{
  if(idx)r+=`<tr><td colspan="4" style="color:#999;text-align:center">···</td></tr>`;
  let ia=h.a,ib=h.b;
  (h.l||[]).forEach(t=>{
   const op=t[0],s=t[1]||"";
   if(op===" "){r+=row(s,"",s,"",ia++,ib++);}
   else if(op==="-"){r+=row(s,"del","","",ia++,"");}
   else{r+=row("","",s,"ins","",ib++);}
  });
 });
 return `<table class="d"><colgroup><col style="width:40px"><col><col style="width:40px"><col></colgroup><tr><th></th><th>Поставщик (БП)</th><th></th><th>Исходная (УП)</th></tr>${r}</table>`;
}
const SN={changed:"изменён",added:"добавлен в УП",removed:"нет в УП",same:"совпадает"};
const stl=p=>p.returned?"нет в УП → возвращён в типовой (есть в restored)":SN[p.status];
function render(keepTree){if(!keepTree)treeBuilt=false;buildTree();const v=vis();
 if(!v.length){document.getElementById("view").innerHTML=onlyChanged()?"Нет модулей с изменёнными методами (методы «нет в УП» скрыты).":"Отличий в периметре нет.";return}
 if(v.indexOf(mods[cur])<0){cur=mods.indexOf(v[0]);curP=-1}
 document.querySelectorAll(".mod.sel,.proc.sel").forEach(el=>el.classList.remove("sel"));
 const m=mods[cur],ps=procs(m);const md=document.getElementById("m"+cur);if(md)md.classList.add("sel");
 let pl="";ps.forEach((p,k)=>{const hb=hkLabel(p.hook);pl+=`<div class="proc st-${p.status}${k==curP?" sel":""}" onclick="sel(${cur},${k})">${badges(p)}${hb?`<span class="hook">${esc(hb)}</span>`:""}${esc(p.name)} — ${stl(p)}</div>`});const plc=document.getElementById("pl"+cur);if(plc)plc.innerHTML=pl;
 let el=document.getElementById("m"+cur);while(el){if(el.tagName=="DETAILS")el.open=true;el=el.parentElement}if(md)md.scrollIntoView({block:"nearest"});
 const c=m.counts||{};let h=`<h3>${esc(m.path)}</h3><div>${esc(m.object)} · ${BN[m.bucket]} · раздел ${v.indexOf(m)+1} из ${v.length}</div>`;
 h+=`<div class="hint"><b>Что смотреть.</b> ${esc(m.reason)}`;
 if(m.bucket=="manual")h+=`<br>Процедур: изменено ${c.changed}, нет в УП ${c.removed}, добавлено ${c.added}, совпадает ${c.same}. Ручной разбор — изменённые без безопасного хука и удалённые; добавленные и безопасные хуки можно унести автоматически.<br>По каждому методу решите: <b>унести доработку в расширение</b> и вернуть типовой текст, <b>вернуть типовой</b> (если отличие — устаревший код), или оставить как есть. Удалённые методы <b>не откатывать вслепую</b>.`;
 if(m.outsideDiffers)h+=`<br>Отличается код вне процедур.`;h+="</div>";
 if(curP>=0&&ps[curP]){const p=ps[curP];const hb=hkLabel(p.hook);h+=`<h3>${badges(p)}${hb?`<span class="hook">${esc(hb)}</span> `:""}${p.kind} ${esc(p.name)} — ${stl(p)}</h3>`;if(p.explain)h+=`<div class="hint">${esc(p.explain)}</div>`;
  if(p.hookBody)h+=`<div class="hookbody"><b>Предлагаемое тело хука</b><pre>${esc(p.hookBody)}</pre></div>`;
  if(p.status=="same")h+="<div>Текст совпадает после нормализации.</div>";
  else if(!(m.bucket=="auto"&&p.hookBody))h+=p.diff?renderHunks(p.diff):"";}
 else if(m.bucket=="only_source"||m.bucket=="only_vendor")h+=`<pre>${esc(m.text||"")}</pre>`;
 else if(m.bucket=="cosmetic"&&m.diff){h+=`<div>Отличающиеся фрагменты модуля:</div>`+renderHunks(m.diff)}
 else h+=`<div>Выберите процедуру слева или клавишами ↑/↓.</div>`;
 document.getElementById("view").innerHTML=h;document.getElementById("view").scrollTop=0}
document.addEventListener("keydown",e=>{if(e.target.tagName=="INPUT")return;const k=e.key;
 if(k=="ArrowRight"||k=="l"){goMod(1);e.preventDefault()}else if(k=="ArrowLeft"||k=="h"){goMod(-1);e.preventDefault()}
 else if(k=="ArrowDown"||k=="j"){goProc(1);e.preventDefault()}else if(k=="ArrowUp"||k=="k"){goProc(-1);e.preventDefault()}});
(function(){const B=DATA.bsparser;if(!B)return;const a=B.astCheck||{},f=B.fallbacks||[],it=a.items||[];const li=(t,xs)=>`<li>${esc(t)}<ul>${(xs||[]).map(e=>`<li>${esc(e)}</li>`).join("")}</ul></li>`;let h=`<details id="bsparser"><summary>Ручной разбор (bsparser): хуков &amp;ИзменениеИКонтроль с замечаниями ${a.failed||0} из ${a.checked||0}, модулей на старом маршруте ${f.length}</summary>`;if(f.length){h+="<div>Не разобраны bsparser — сравнены старым маршрутом, проверьте вручную:</div><ul>";f.forEach(x=>h+=li(x.path,x.errors));h+="</ul>"}if(it.length){h+="<div>Хуки &amp;ИзменениеИКонтроль с замечаниями (ast_check.json):</div><ul>";it.forEach(x=>h+=li(x.file,x.problems));h+="</ul>"}document.getElementById("main").insertAdjacentHTML("beforebegin",h+"</details>")})();
(function(){const R=DATA.reverseBuild;if(!R)return;const s=R.summary||R,mm=R.mismatches||[],cv=R.commentedVendor||[],co=R.commentOnly||[];
 let h=`<details id="reverseBuild"><summary>Обратная сборка (extension + restored → УП): методов УП ${s.methods||0}, совпало ${s.ok||0}, расхождений ${s.mismatches||0} (потеряно ${s.lost||0}), только комментарии ${s.commentOnly||0}; закомментированные в УП строки БП не под #Удаление: ${s.commentedVendorProblems||0} из ${s.commentedVendorLines||0}</summary>`;
 h+=`<div>Сравниваются тела методов без пробелов и комментариев // АПК:. «Сборка» — restored с наложенными хуками.</div>`;
 h+=`<h4>Расхождения (потерянные или искажённые изменения УП)</h4><ol>`;mm.forEach(e=>{h+=`<li>${esc((e.path||"")+" — "+(e.method||"")+" ["+(e.via||"")+"] "+(e.kind||""))}${e.line?`<br><small>стр. ${e.line}: УП <code>${esc(e.up||"")}</code> / сборка <code>${esc(e.built||"")}</code></small>`:""}</li>`});
 h+=`</ol><h4>Закомментированные в УП строки БП не под #Удаление</h4><ol>`;cv.forEach(e=>{h+=`<li>${esc((e.path||"")+" — "+(e.method||"")+": "+(e.kind||""))}<br><small><code>${esc(e.line||"")}</code></small></li>`});
 h+=`</ol><h4>Отличаются только комментарии</h4><ol>`;co.forEach(e=>{h+=`<li>${esc((e.path||"")+" — "+(e.method||"")+" ["+(e.via||"")+"]")}<br><small>стр. ${e.line||""}: УП <code>${esc(e.up||"")}</code> / сборка <code>${esc(e.built||"")}</code></small></li>`});
 h+=`</ol></details>`;document.getElementById("main").insertAdjacentHTML("beforebegin",h)})();
render(false);
</script></body></html>
