name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  typovaya-oscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OneScript 2.2
        run: |
          curl -fsSL -o /tmp/onescript.zip "https://github.com/EvilBeaver/OneScript/releases/download/v2.2.0/OneScript-2.2.0-linux-x64.zip"
          sudo mkdir -p /opt/onescript
          sudo unzip -oq /tmp/onescript.zip -d /opt/onescript
          sudo chmod +x /opt/onescript/bin/oscript
          echo "/opt/onescript/bin" >> "$GITHUB_PATH"
      - name: typovaya-up tests
        run: OSCRIPT=/opt/onescript/bin/oscript bash typovaya-up/tests/run_tests.sh

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build typovaya-up launcher (WinForms + Core)
        run: |
          dotnet build typovaya-up/launcher/TypovayaUp.Launcher/TypovayaUp.Launcher.csproj -c Release --nologo
          dotnet build typovaya-up/launcher/TypovayaUp.Launcher.Core/TypovayaUp.Launcher.Core.csproj -c Release --nologo
      - name: Test typovaya-up launcher
        run: dotnet test tests/TypovayaUp.Launcher.Tests/TypovayaUp.Launcher.Tests.csproj -c Release --nologo
      - name: Test solution (Sverka)
        run: dotnet test 1c-sverka.sln -c Release --nologo

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish single-file
        run: >
          dotnet publish src/Sverka.App/Sverka.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -o publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sverka-win-x64
          path: publish/sverka.exe
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/sverka.exe
          generate_release_notes: true
          body: |
            Самодостаточный `sverka.exe` (win-x64, single-file с нативными библиотеками Avalonia/Skia).
